<div id="fps"></div>
<script type="module">
    import * as PB from "./js/path-bool.js";

    const bgsvg = document.getElementById("bg");
    const fgsvg = document.getElementById("fg");
    const resultsvg = document.getElementById("result");

    const bgpath = PB.pathFromPathData(bgsvg.getAttribute("d"));
    const fgpath = PB.pathFromPathData(fgsvg.getAttribute("d"));

    function applyTransformPoint(point, matrix) {
        return [
            point[0] * matrix[0] + point[1] * matrix[2] + matrix[4],
            point[0] * matrix[1] + point[1] * matrix[3] + matrix[5]
        ];
    }

    function applyTransformPath(path, matrix) {
        return path.map(seg => {
            switch (seg[0]) {
                case "L":
                case "C":
                case "Q":
                    return [seg[0], ...seg.slice(1).map(p => applyTransformPoint(p, matrix))];
                case "A":
                    return applyTransformPath(PB.arcSegmentToCubics(seg, Math.PI / 2), matrix);
            }
        });
    }

    function makeIdentityMatrix(x, y) {
        return [
            1, 0,
            0, 1,
            0, 0
        ];
    }

    function makeTranslationMatrix(x, y) {
        return [
            1, 0,
            0, 1,
            x, y
        ];
    }

    function makeRotationMatrix(angle) {
        return [
            Math.cos(angle),
            -Math.sin(angle),
            Math.sin(angle),
            Math.cos(angle),
            0,
            0
        ];
    }

    function multiplyMatrices(a, b) {
        return [
            a[0] * b[0] + a[2] * b[1],
            a[1] * b[0] + a[3] * b[1],
            a[0] * b[2] + a[2] * b[3],
            a[1] * b[2] + a[3] * b[3],
            a[0] * b[4] + a[2] * b[5] + a[4],
            a[1] * b[4] + a[3] * b[5] + a[5]
        ];
    }

    let frames = 0;
    let last = performance.now();

    function draw() {
        requestAnimationFrame(draw);
        const now = performance.now();
        const angle = now * 1e-4;
        const matrix = [
            makeTranslationMatrix(640 + 320 * Math.sin(now * 3e-4), 360),
            makeRotationMatrix(angle),
            makeTranslationMatrix(-640, -360)
        ].reduce(multiplyMatrices, makeIdentityMatrix());
        fgsvg.setAttribute("transform", `matrix(${matrix.join(" ")})`);
        const fgtrans = applyTransformPath(fgpath, matrix);
        const resultpaths = new PB.PathBoolean([
            { path: bgpath, fillRule: PB.FillRule.NonZero },
            { path: fgtrans, fillRule: PB.FillRule.NonZero },
        ]).get(PB.PathBooleanOperation.Intersection);
        resultsvg.setAttribute("d", PB.pathToPathData(resultpaths[0]));
        frames++;
        if (now - last > 1e3) {
            document.getElementById("fps").innerText = frames + " fps";
            frames = 0;
            last = now;
        }
    }

    draw();
</script>
